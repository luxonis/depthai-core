version: '3'

# Variables come from .devcontainer/.env, which createEnv.sh writes (gitignored):
#   DOCKER_USER               uid:gid of the host user
#   DEPTHAI_DEVICE_SDK_IMAGE  Luxonis OS RVC4 SDK image (private today; ghcr.io/luxonis/depthai-device-sdk is planned)
#   VENDOR_SOURCE_DIR         host path of the private depthai-device-rvc4-vendor module
services:
  rvc4-dev:
    build:
      context: .
      dockerfile: Dockerfile.rvc4
      args:
        # Same default as in Dockerfile.rvc4 and createEnv.sh
        DEPTHAI_DEVICE_SDK_IMAGE: ${DEPTHAI_DEVICE_SDK_IMAGE:?set DEPTHAI_DEVICE_SDK_IMAGE to the Luxonis OS RVC4 SDK image}
    env_file:
      - .env
    volumes:
      - ../:/work
      # Private depthai-device-rvc4-vendor module (licensee-only Qualcomm/ST code); CMake finds it at /depthai-device-rvc4-vendor
      - ${VENDOR_SOURCE_DIR:-../../depthai-device-vendor-fw}:/depthai-device-rvc4-vendor
      - /etc/passwd:/etc/passwd:ro
      - /etc/shadow:/etc/shadow:ro
      - ${HOME}:${HOME}:ro
    command: bash
    stdin_open: true
    tty: true
    environment:
      HOME: /home/docker
      DEPTHAI_DEVICE_RVC4_VENDOR_SOURCE_DIR: /depthai-device-rvc4-vendor
      TERM: xterm-256color
    group_add:
      - sudo
    user: ${DOCKER_USER}
