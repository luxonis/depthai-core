syntax = "proto3";

import "common.proto";
package dai.proto.nn_data;

message NNData {
    int64 sequenceNum = 1;
    common.Timestamp ts = 2;
    common.Timestamp tsDevice = 3;
    repeated TensorInfo tensors = 4;
    uint32 batchSize = 5;
    common.ImgTransformation transformation = 6;
    bytes data = 7;
    optional common.Timestamp tsSystem = 8;
}

message TensorInfo {
    StorageOrder order = 1;
    DataType dataType = 2;
    uint32 numDimensions = 3;
    repeated uint32 dims = 4;
    repeated uint32 strides = 5;
    string name = 6;
    uint32 offset = 7;
    // quantization params (deqValue = (val - qpZp) * scale )
    bool quantization = 8;
    float qpScale = 9;
    float qpZp = 10;
}

enum StorageOrder {
    // proto3 requires a zero valued entry. dai::TensorInfo::StorageOrder has no
    // zero valued entry, so this one is never written by depthai.
    STORAGE_ORDER_UNSPECIFIED = 0;
    NHWC = 0x4213;
    NHCW = 0x4231;
    NCHW = 0x4321;
    HWC = 0x213;
    CHW = 0x321;
    WHC = 0x123;
    HCW = 0x231;
    WCH = 0x132;
    CWH = 0x312;
    NC = 0x43;
    CN = 0x34;
    C = 0x3;
    H = 0x2;
    W = 0x1;
}

enum DataType {
    FP16 = 0;   // Half precision floating point
    U8F = 1;    // Unsigned byte
    INT = 2;    // Signed integer (4 byte)
    FP32 = 3;   // Single precision floating point
    I8 = 4;     // Signed byte
    FP64 = 5;   // Double precision floating point
    U16F = 6;   // Unsigned short (16 bit)
}
