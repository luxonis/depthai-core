# Public build images of the RVC4 firmware (device/rvc4/docker/Dockerfile.sdk): Ubuntu 22.04, the Arm GNU Toolchain,
# the public sysroot of Luxonis OS and the FastCV headers. Two images: release (the release firmware) and dev (release
# plus the sanitizer libraries). Pushed as ghcr.io/luxonis/depthai-device-sdk:<sysroot version> and
# :<sysroot version>-dev, and each also with -<commit> after the sysroot version.
# device/rvc4/create_deployment_artifacts.sh uses the tags without the commit by default.
name: RVC4 device SDK image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'device/rvc4/docker/**'
      - '.github/workflows/containers_device_rvc4_sdk.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'device/rvc4/docker/**'
      - '.github/workflows/containers_device_rvc4_sdk.yml'

jobs:
  sdk-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luxonis/depthai-device-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set the image tags
        run: |
          version=$(sed -n 's/^ARG RVC4_SYSROOT_VERSION=//p' device/rvc4/docker/Dockerfile.sdk)
          test -n "$version"
          echo "IMAGE_TAG=$version" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_COMMIT=$version-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build the images
        run: |
          docker build -f device/rvc4/docker/Dockerfile.sdk --target release -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:$IMAGE_TAG_COMMIT" device/rvc4/docker
          docker build -f device/rvc4/docker/Dockerfile.sdk --target dev -t "$IMAGE:$IMAGE_TAG-dev" -t "$IMAGE:$IMAGE_TAG_COMMIT-dev" device/rvc4/docker

      - name: Check the images
        run: |
          for tag in "$IMAGE_TAG" "$IMAGE_TAG-dev"; do
            docker run --rm "$IMAGE:$tag" bash -c '
              set -e
              aarch64-none-linux-gnu-g++ --version | head -1
              cmake --version | head -1
              python3 -c "import numpy; print(\"numpy\", numpy.__version__)"
              test -f "$DEPTHAI_DEVICE_RVC4_SYSROOT/usr/include/python3.10/Python.h"
              cat "$DEPTHAI_DEVICE_RVC4_SYSROOT/VERSION"
              test -f "$DEPTHAI_DEVICE_RVC4_SYSROOT/usr/include/fastcv/fastcv.h"
              test -f "$DEPTHAI_DEVICE_RVC4_SYSROOT/usr/share/licenses/fastcv/LICENSE"
              install-hexagon-sdk.sh --help >/dev/null'
          done
          # Only the dev image has the sanitizer libraries
          test "$(docker run --rm "$IMAGE:$IMAGE_TAG" aarch64-none-linux-gnu-g++ -print-file-name=libasan.so)" = libasan.so
          docker run --rm "$IMAGE:$IMAGE_TAG-dev" bash -c 'for l in libasan.so libtsan.so libubsan.so; do test -f "$(aarch64-none-linux-gnu-g++ -print-file-name=$l)"; done'

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        if: github.event_name != 'pull_request'
        run: |
          for tag in "$IMAGE_TAG_COMMIT" "$IMAGE_TAG_COMMIT-dev" "$IMAGE_TAG" "$IMAGE_TAG-dev"; do
            docker push "$IMAGE:$tag"
          done
