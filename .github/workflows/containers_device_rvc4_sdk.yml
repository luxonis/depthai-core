# Public build images of the RVC4 firmware that depthai-core pins (DEPTHAI_DEVICE_RVC4_SDK_IMAGE in
# cmake/Depthai/DepthaiDeviceRVC4Config.cmake): ghcr.io/luxonis/depthai-device-sdk:os-<Luxonis OS version>-<vendor commit>
# and the same tag with -dev. The private CI of the vendor module uploads the inputs of these images (the public sysroot
# of Luxonis OS and the build files) to the artifact server. device/rvc4/docker/sdk-images.sh builds the images from
# these inputs.
#
#   pull request, push to main  Check the pinned images. When the registry does not have them yet, build them in the
#                               runner from their inputs and check them. No push.
#   push to develop             Push the pinned images when the registry does not have them. Move os-<OS version> and
#                               os-<OS version>-dev to them when these tags point to other images.
#   manual run (any branch)     Push the pinned images of that branch when the registry does not have them. The job
#                               runs in the environment ghcr: its required reviewers (repository settings, Environments)
#                               approve each push. It does not move os-<OS version>[-dev].
#
# The pushes use GITHUB_TOKEN: the package depthai-device-sdk gives this repository the role Write (package settings,
# Manage Actions access). A fixed tag is never pushed again (sdk-images.sh publish).
name: RVC4 device SDK image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'device/rvc4/docker/**'
      - 'cmake/Depthai/DepthaiDeviceRVC4Config.cmake'
      - '.github/workflows/containers_device_rvc4_sdk.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'device/rvc4/docker/**'
      - 'cmake/Depthai/DepthaiDeviceRVC4Config.cmake'
      - '.github/workflows/containers_device_rvc4_sdk.yml'

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/develop')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the pinned images (pull, or build from their inputs)
        run: |
          device/rvc4/docker/sdk-images.sh ensure release
          device/rvc4/docker/sdk-images.sh ensure dev

      - name: Check the pinned images
        run: device/rvc4/docker/sdk-images.sh check

  publish-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # One push job at a time: two jobs must not push the same fixed tag
    concurrency:
      group: rvc4-sdk-image-push
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the pinned images when the registry does not have them
        run: device/rvc4/docker/sdk-images.sh publish

      - name: Move os-<OS version>[-dev] to the pinned images
        run: device/rvc4/docker/sdk-images.sh promote

      - name: Check the pinned images
        run: device/rvc4/docker/sdk-images.sh check

  publish-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ghcr
    permissions:
      contents: read
      packages: write
    concurrency:
      group: rvc4-sdk-image-push
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the pinned images when the registry does not have them
        run: device/rvc4/docker/sdk-images.sh publish

      - name: Check the pinned images
        run: device/rvc4/docker/sdk-images.sh check
