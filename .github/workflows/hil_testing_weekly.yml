name: DepthAI Core HIL Testing Weekly

on:
  workflow_dispatch:
    inputs:
      test_os:
        description: Run Linux, Windows, and macOS tests
        type: boolean
        default: true
      test_replay:
        description: Run replay tests
        type: boolean
        default: true
      test_sanitizers:
        description: Run sanitizer tests
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

# Only allow latest run on same branch to be tested
concurrency:
  group: ci-tests-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  select_tests:
    runs-on: ubuntu-latest
    outputs:
      test_all: ${{ steps.selection.outputs.test_all }}
    steps:
      - id: selection
        run: echo "test_all=${{ !inputs.test_os && !inputs.test_replay && !inputs.test_sanitizers }}" >> "$GITHUB_OUTPUT"

  run_vanilla_tests:
    needs: select_tests
    if: inputs.test_os || needs.select_tests.outputs.test_all == 'true'
    uses: ./.github/workflows/test_child.yml
    with:
      flavor: "vanilla"
      luxonis_os_versions_to_test: "['1.30.1','1.35.0','1.40.0']"
      luxonis_os_versions_to_test_rgb: "['1.40.0']"
      luxonis_os_versions_to_test_usb: "['1.40.0']"
    secrets:
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}

  run_tsan_tests:
    needs: select_tests
    if: inputs.test_sanitizers || needs.select_tests.outputs.test_all == 'true'
    uses: ./.github/workflows/test_child.yml
    with:
      flavor: "tsan"
      luxonis_os_versions_to_test: "['1.40.0']"
    secrets:
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}

  run_asan-ubsan_tests:
    needs: select_tests
    if: inputs.test_sanitizers || needs.select_tests.outputs.test_all == 'true'
    uses: ./.github/workflows/test_child.yml
    with:
      flavor: "asan-ubsan"
      luxonis_os_versions_to_test: "['1.40.0']"
    secrets:
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}

  run_windows_tests:
    needs: select_tests
    if: inputs.test_os || needs.select_tests.outputs.test_all == 'true'
    uses: ./.github/workflows/test_child_windows.yml
    with:
      luxonis_os_versions_to_test: "['1.40.0']"
      luxonis_os_versions_to_test_usb: '["1.40.0"]'
    secrets:
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}

  run_replay_tests:
    needs: select_tests
    if: inputs.test_replay || needs.select_tests.outputs.test_all == 'true'
    uses: ./.github/workflows/test_child.yml
    with:
      flavor: "vanilla"
      job_prefix: "vanilla-replay"
      enable_replay_tests: true
      rvc2_timeout_minutes: 1440
      luxonis_os_versions_to_test: "['1.40.0']"
    secrets:
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}

  run_vanilla_mac_tests:
    needs: select_tests
    if: inputs.test_os || needs.select_tests.outputs.test_all == 'true'
    uses: ./.github/workflows/test_child_mac.yml
    with:
      flavor: "vanilla"
      luxonis_os_versions_to_test: "['1.40.0']"
      luxonis_os_versions_to_test_usb: '["1.40.0"]'
    secrets:
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}

  notify_slack:
    needs:
      - select_tests
      - run_vanilla_tests
      - run_tsan_tests
      - run_asan-ubsan_tests
      - run_windows_tests
      - run_replay_tests
      - run_vanilla_mac_tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ['self-hosted', 'testbed-runner']
    steps:
      - uses: actions/checkout@v3
      - name: Send Slack test summary
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BOT_CHANNEL_ID: ${{ secrets.SLACK_BOT_CHANNEL_ID_TEST }}
          INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
          INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          python3 scripts/ci/report_failed_tests.py "slackNotificationPayload.json"
          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json" \
            --data @slackNotificationPayload.json 
