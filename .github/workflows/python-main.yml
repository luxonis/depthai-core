name: Classical GPU stereo wheels (Python 3.11)
run-name: Classical GPU stereo c15b7029 - Windows and macOS
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CMAKE_WINDOWS_SDK_VERSION: 10.0.26100.0
jobs:
  build-docstrings:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: c15b7029e473e9a49608480baee012fa74e9c503
        persist-credentials: false
    - name: Setup cmake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      with:
        cmakeVersion: 3.31.x
        useCloudCache: false
    - name: Restore vcpkg binary cache
      uses: ./.github/actions/vcpkg-cache/restore
      with:
        family: py-docstrings
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: 'sudo apt update

        python -m pip install --upgrade pip

        sudo apt install libusb-1.0-0-dev pkg-config bison autoconf libtool libxi-dev libxtst-dev libxrandr-dev
        libx11-dev libxft-dev libxext-dev nasm flex libudev-dev automake libltdl-dev

        python -m pip install -r bindings/python/docs/requirements_mkdoc.txt

        '
    - name: Configure project
      run: "cmake -S . \\\n  -B build \\\n  -DDEPTHAI_VCPKG_INTERNAL_ONLY=OFF \\\n  -DVCPKG_OVERLAY_TRIPLETS=\"\
        $PWD/cmake/triplets/release\" \\\n  -DDEPTHAI_BUILD_PYTHON=ON \\\n  -DDEPTHAI_PYTHON_FORCE_DOCSTRINGS=ON\
        \ \\\n  -DDEPTHAI_BASALT_SUPPORT=ON \\\n  -DDEPTHAI_PCL_SUPPORT=ON \\\n  -DDEPTHAI_RTABMAP_SUPPORT=ON \\\
        \n  -DDEPTHAI_PYTHON_DOCSTRINGS_OUTPUT=\"$PWD/bindings/python/docstrings/depthai_python_docstring.hpp\"\n"
    - name: Build target 'pybind11_mkdoc'
      run: cmake --build build --target pybind11_mkdoc --parallel 4
    - name: Print out vcpkg logs if building port fails
      if: failure()
      run: bash ./bindings/python/ci/show_vcpkg_logs.sh
    - name: Upload docstring artifacts
      uses: actions/upload-artifact@v7
      with:
        name: docstrings
        path: bindings/python/docstrings/
        retention-days: 1
    timeout-minutes: 360
  build-windows-x86_64:
    needs:
    - build-docstrings
    runs-on: windows-2025
    strategy:
      matrix:
        python-version:
        - '3.11'
        python-architecture:
        - x64
      fail-fast: false
    env:
      DEPTHAI_BUILD_BASALT: false
      DEPTHAI_BUILD_PCL: true
      DEPTHAI_BUILD_RTABMAP: true
      DEPTHAI_BUILD_KOMPUTE: true
      CMAKE_GENERATOR: Visual Studio 18 2026
      CMAKE_GENERATOR_TOOLSET: v143
    steps:
    - name: Setup cmake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      with:
        cmakeVersion: 4.2.x
        useCloudCache: false
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: c15b7029e473e9a49608480baee012fa74e9c503
        persist-credentials: false
    - name: Restore vcpkg binary cache
      uses: ./.github/actions/vcpkg-cache/restore
      with:
        family: wheel
    - uses: actions/download-artifact@v8
      with:
        name: docstrings
        path: bindings/python/docstrings
    - name: Specify docstring to use while building the wheel
      run: echo "DEPTHAI_PYTHON_DOCSTRINGS_INPUT=$PWD/bindings/python/docstrings/depthai_python_docstring.hpp" |
        Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Select Windows SDK
      run: echo "CMAKE_ARGS=-DCMAKE_SYSTEM_VERSION=${{ env.CMAKE_WINDOWS_SDK_VERSION }}" | Out-File -FilePath $env:GITHUB_ENV
        -Encoding utf8 -Append
    - name: Use vcpkg's Fortran compiler
      run: "# VS Flang lacks intrinsic modules; hide it so vcpkg uses its MinGW fallback.\nGet-ChildItem \"$env:ProgramFiles\\\
        Microsoft Visual Studio\\18\\*\\VC\\Tools\\Llvm\" -Recurse -Filter \"flang*.exe\" |\n  ForEach-Object {\
        \ Rename-Item -LiteralPath $_.FullName -NewName \"$($_.Name).disabled\" -Verbose }\n"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.python-architecture }}
    - name: Set UTF-8 encoding
      run: 'echo "PYTHONIOENCODING=utf-8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        echo "PYTHONUTF8=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        '
    - name: Append build hash if not a tagged commit
      if: startsWith(github.ref, 'refs/tags/v') != true
      run: echo "BUILD_COMMIT_HASH=c15b7029e473e9a49608480baee012fa74e9c503" | Out-File -FilePath $env:GITHUB_ENV
        -Encoding utf8 -Append
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        '
    - name: Building wheels
      run: cd bindings/python && python -m pip wheel . -w ./wheelhouse/ --no-deps --verbose
    - name: Verify wheel license files
      shell: bash
      run: python scripts/verify_license_artifact.py wheel bindings/python/wheelhouse/*.whl
    - name: Print out vcpkg logs if building port fails
      if: failure()
      run: cd bindings/python && bash ./ci/show_vcpkg_logs.sh
    - name: Install delvewheel
      run: python -m pip install "delvewheel==1.12.1"
    - name: List wheelhouse
      run: cd bindings/python && ls ./wheelhouse
    - name: Auditing wheels
      shell: bash
      run: "cd bindings/python\nEXTRA_DLL_PATH=$(find ./build -type d -name \"temp.win*\" -exec ls -d {} \\; | head\
        \ -n 1)/Release/Release\necho \"delvewheel extra dll path: $EXTRA_DLL_PATH\"\nfor wheel in ./wheelhouse/*.whl;\
        \ do\n  delvewheel repair \"$wheel\" --add-path \"$EXTRA_DLL_PATH\" --include vcruntime140.dll --include\
        \ vcruntime140_1.dll --include ucrtbase.dll -w wheelhouse/audited\ndone\n"
    - name: Verify repaired wheel license files
      shell: bash
      run: python scripts/verify_license_artifact.py wheel bindings/python/wheelhouse/audited/*.whl
    - name: Install repaired wheel and verify classical API
      shell: bash
      run: 'python -m pip install bindings/python/wheelhouse/audited/*.whl

        python -m pip check

        cd "$RUNNER_TEMP"

        python -c "import depthai as d; assert d.__version__ == ''3.12.0.dev0+c15b7029e473e9a49608480baee012fa74e9c503'',
        d.__version__; c=d.GPUStereoConfig(); c.setComputeMode(d.GPUStereoConfig.ComputeMode.GPU_CPU); c.setTemporalFilter(False);
        print(d.__version__, ''classical API OK'')"

        '
    - name: Archive wheel artifacts
      uses: actions/upload-artifact@v7
      with:
        name: audited-wheels-windows-${{ matrix.python-version }}
        path: bindings/python/wheelhouse/audited/*
    timeout-minutes: 360
  build-macos:
    needs:
    - build-docstrings
    strategy:
      matrix:
        python-version:
        - '3.11'
        os:
        - macos-15-intel
        - macos-14
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      DEPTHAI_BUILD_BASALT: true
      DEPTHAI_BUILD_PCL: true
      DEPTHAI_BUILD_RTABMAP: true
      DEPTHAI_BUILD_KOMPUTE: true
    steps:
    - name: Setup cmake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
      with:
        cmakeVersion: 3.31.x
        useCloudCache: false
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        ref: c15b7029e473e9a49608480baee012fa74e9c503
        persist-credentials: false
    - name: Restore vcpkg binary cache
      uses: ./.github/actions/vcpkg-cache/restore
      with:
        family: wheel-${{ matrix.os }}
    - uses: actions/download-artifact@v8
      with:
        name: docstrings
        path: bindings/python/docstrings
    - name: Specify docstring to use while building the wheel
      run: echo "DEPTHAI_PYTHON_DOCSTRINGS_INPUT=$PWD/bindings/python/docstrings/depthai_python_docstring.hpp" >>
        $GITHUB_ENV
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Append build hash if not a tagged commit
      if: startsWith(github.ref, 'refs/tags/v') != true
      run: echo "BUILD_COMMIT_HASH=c15b7029e473e9a49608480baee012fa74e9c503" >> $GITHUB_ENV
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        brew install libusb

        brew install nasm

        python -m pip install delocate

        '
    - name: Building wheels
      run: cd bindings/python && python -m pip wheel . -w ./wheelhouse/ --no-deps --verbose
    - name: Verify wheel license files
      shell: bash
      run: python scripts/verify_license_artifact.py wheel bindings/python/wheelhouse/*.whl
    - name: Print out vcpkg logs if building port fails
      if: failure()
      run: cd bindings/python && bash ./ci/show_vcpkg_logs.sh
    - name: Auditing wheels
      run: cd bindings/python && ci/repair-whl-macos.sh `pwd`/wheelhouse/* `pwd`/wheelhouse/audited
    - name: Verify repaired wheel license files
      shell: bash
      run: python scripts/verify_license_artifact.py wheel bindings/python/wheelhouse/audited/*.whl
    - name: Install repaired wheel and verify classical API
      shell: bash
      run: 'python -m pip install bindings/python/wheelhouse/audited/*.whl

        python -m pip check

        cd "$RUNNER_TEMP"

        python -c "import depthai as d; assert d.__version__ == ''3.12.0.dev0+c15b7029e473e9a49608480baee012fa74e9c503'',
        d.__version__; c=d.GPUStereoConfig(); c.setComputeMode(d.GPUStereoConfig.ComputeMode.GPU_CPU); c.setTemporalFilter(False);
        print(d.__version__, ''classical API OK'')"

        '
    - name: Archive wheel artifacts
      uses: actions/upload-artifact@v7
      with:
        name: audited-wheels-macos-${{ matrix.os }}-${{ matrix.python-version }}
        path: bindings/python/wheelhouse/audited/*
    timeout-minutes: 360
