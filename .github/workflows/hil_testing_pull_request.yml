name: DepthAI Core HIL Testing PR

# Trigger on submitted reviews
on:
  pull_request_review:
    types: [submitted]

# Cancel older runs for the same PR and review state.
concurrency:
  group: depthai-core-pr-testing-${{ github.event.pull_request.number }}-${{ github.event.review.state }}
  cancel-in-progress: true

jobs:
  # Build the docker container
  build_docker_container:
    name: Build HIL test container
    if: >
      github.event.review.state == 'approved' &&
      (
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'develop'
      )
    runs-on: ['self-hosted', 'hil-test-v3']
    outputs:
      tag: ${{ steps.build_and_push.outputs.tag }}
    steps:
    - uses: actions/checkout@v4

    - name: Build and push
      id: build_and_push
      env:
        CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      run: |
        JOB_PREFIX="pr-approved"
        SOURCE_REF="refs/pull/${{ github.event.pull_request.number }}/merge"
        PULL_REQUEST="true"
        TAG="${JOB_PREFIX}_short_${{ github.sha }}"

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Using source ref: $SOURCE_REF"
        scripts/hil/build_and_push.sh "vanilla" "$SOURCE_REF" "$CONTAINER_REGISTRY" "${{ github.sha }}" "$PARALLEL_JOBS" "$PULL_REQUEST" "$TAG" "false"

  # Run RVC2 Tests
  linux_rvc2_test:
    name: linux_rvc2_test
    needs: [build_docker_container]
    runs-on: ['self-hosted', 'testbed-runner']
    timeout-minutes: 720
    steps:
    - uses: actions/checkout@v4

    - name: Run RVC2 tests
      run: |
        source scripts/hil/prepare_hil_framework.sh "${{ secrets.HIL_PAT_TOKEN }}"
        export RESERVATION_NAME="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#rvc2-pr-approved"
        set -o pipefail
        hil_runner \
          --capabilities depthai-core-hil \
          --platforms 'rvc2 and rvc2' \
          --reservation-name "$RESERVATION_NAME" \
          --wait \
          --docker-image ${{ secrets.CONTAINER_REGISTRY }}/depthai-core-hil:${{ needs.build_docker_container.outputs.tag }} \
          --commands "export DEPTHAI_TELEMETRY_URL='${{ secrets.CI_TELEMETRY_URL }}'; export DEPTHAI_TELEMETRY_API_KEY='${{ secrets.CI_TELEMETRY_API_KEY }}'; ./tests/run_tests_entrypoint.sh rvc2" \
          2>&1 | tee rvc2_test_output.log

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-log-pr-approved-linux_rvc2_test
        path: rvc2_test_output.log
        if-no-files-found: warn

  # Run RVC4 Tests (on a single OS)
  linux_rvc4_test:
    name: linux_rvc4_test (${{ matrix.rvc4os }})
    needs: [build_docker_container]
    strategy:
      matrix:
        rvc4os: ['1.33.0']
      fail-fast: false
    runs-on: ['self-hosted', 'testbed-runner']
    steps:
    - uses: actions/checkout@v4

    - name: Run RVC4 tests
      run: |
        source scripts/hil/prepare_hil_framework.sh "${{ secrets.HIL_PAT_TOKEN }}"
        export RESERVATION_NAME="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#rvc4-${{ matrix.rvc4os }}-pr-approved"
        set -o pipefail
        hil_runner \
          --models "oak4_pro or oak4_d" \
          --reservation-name "$RESERVATION_NAME" \
          --wait \
          --rvc4-os-version ${{ matrix.rvc4os }} \
          --docker-image ${{ secrets.CONTAINER_REGISTRY }}/depthai-core-hil:${{ needs.build_docker_container.outputs.tag }} \
          --commands "export DEPTHAI_TELEMETRY_URL='${{ secrets.CI_TELEMETRY_URL }}'; export DEPTHAI_TELEMETRY_API_KEY='${{ secrets.CI_TELEMETRY_API_KEY }}'; ./tests/run_tests_entrypoint.sh rvc4" \
          2>&1 | tee rvc4_test_output.log

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-log-pr-approved-linux_rvc4_test-rvc4os=${{ matrix.rvc4os }}
        path: rvc4_test_output.log
        if-no-files-found: warn

  # Final step, report on the tests, etc.
  required_hil_test_report:
    name: Required HIL test report (${{ github.event.review.state }})
    needs: [linux_rvc2_test, linux_rvc4_test]
    if: >
      always() &&
      github.event.review.state == 'approved' &&
      (
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'develop'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Download test logs
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: ctest-log-pr-approved-*
        path: ctest-logs

    - name: Generate combined summary
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "python3 not available, skipping test summary." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        shopt -s nullglob
        found_logs=0
        first_summary=1
        for dir in ctest-logs/ctest-log-pr-approved-*; do
          [ -d "$dir" ] || continue
          log_files=("$dir"/*.log)
          [ ${#log_files[@]} -gt 0 ] || continue
          found_logs=1
          context="$(basename "$dir")"
          context="${context#ctest-log-pr-approved-}"
          if [ "$first_summary" -eq 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          first_summary=0
          python3 scripts/ci/ctest_summary.py "${log_files[0]}" "$context" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
        done

        if [ "$found_logs" -eq 0 ]; then
          echo "No test logs found to summarize." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Check required test results
      run: |
        if [[ "${{ needs.linux_rvc2_test.result }}" != "success" || "${{ needs.linux_rvc4_test.result }}" != "success" ]]; then
          echo "Required HIL tests failed or did not complete."
          echo "linux_rvc2_test: ${{ needs.linux_rvc2_test.result }}"
          echo "linux_rvc4_test: ${{ needs.linux_rvc4_test.result }}"
          exit 1
        fi
