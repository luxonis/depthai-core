name: DepthAI Core HIL Testing PR

# PR updates create a check; adding testable or manually rerunning starts HIL.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read

# Keep lightweight PR updates from cancelling a requested HIL run.
concurrency:
  group: depthai-core-pr-testing-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.label.name == 'testable' || github.run_attempt > 1 || github.event_name == 'workflow_dispatch') && 'full' || 'precheck' }}
  cancel-in-progress: true

jobs:
  run_pr_tests:
    name: Run Linux PR HIL tests
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && (github.event.label.name == 'testable' || github.run_attempt > 1) &&
      (
        github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'develop'
      ))
    uses: ./.github/workflows/test_child.yml
    with:
      flavor: "vanilla"
      job_prefix: "pr-approved"
      rvc2_protocol: "usb"
      luxonis_os_versions_to_test: "['1.44.0']"
    secrets:
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      HIL_PAT_TOKEN: ${{ secrets.HIL_PAT_TOKEN }}
      CI_TELEMETRY_URL: ${{ secrets.CI_TELEMETRY_URL }}
      CI_TELEMETRY_API_KEY: ${{ secrets.CI_TELEMETRY_API_KEY }}
      INFLUXDB_TEST_REPORT_BUCKET: ${{ secrets.INFLUXDB_TEST_REPORT_BUCKET }}
      INFLUXDB_ORG: ${{ secrets.INFLUXDB_ORG }}
      INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
      INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}

  required_hil_test_report:
    name: ${{ ((github.event_name == 'pull_request' && (github.event.label.name == 'testable' || github.run_attempt > 1)) && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'develop')) && 'Required HIL test report' || 'Run HIL tests (open Details)' }}
    needs: [run_pr_tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Check required test results
      env:
        SHOULD_RUN: ${{ (github.event_name == 'pull_request' && (github.event.label.name == 'testable' || github.run_attempt > 1)) && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'develop') }}
        RESULT: ${{ needs.run_pr_tests.result }}
      run: |
        if [[ "$SHOULD_RUN" != "true" ]]; then
          echo "Open this workflow run and select Re-run all jobs to run HIL tests, or add the testable label to the PR."
          printf '%s\n' \
            '**HIL tests have not run.**' '' \
            "[Open this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and select **Re-run all jobs**." '' \
            'Alternatively, add the `testable` label to the PR to start the C++, Python, and HIL suites.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [[ "$RESULT" != "success" ]]; then
          echo "Required HIL tests failed or did not complete."
          echo "run_pr_tests: $RESULT"
          exit 1
        fi
