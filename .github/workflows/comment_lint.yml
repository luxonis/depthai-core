name: Comment lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  comment-lint:
    name: Comment lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r ci/requirements-binding-check.txt
      - name: Test the comment check
        run: python -m unittest discover -s ci/tests -p 'test_comments.py'
      - name: Check the comments in the changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ci/check_comments.py --base "$BASE_SHA"
