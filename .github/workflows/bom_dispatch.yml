name: BOM tests dispatch

# Dispatches the luxonis-bom tests for the commit of the calling run, and waits for the result. The BOM
# tests install the wheels that upload-wheels-to-ak (python-main.yml) published, so call it only after that
# job passed. Callers:
#   - python-main.yml, for pushes to main, release branches and tags. A newer push to the same branch
#     cancels the wait (the concurrency of python-main.yml).
#   - hil_testing_nightly.yml, for the nightly develop build, after the HIL tests.
# The wait keeps an ubuntu runner busy for 135-361 min (develop runs of 2026-10-06..08).

on:
  workflow_call:

jobs:
  dispatch-bom-tests:
    runs-on: ubuntu-latest
    outputs:
      runner_conclusion: ${{ steps.get_runner.outputs.runner_conclusion }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Get dev version from script
        id: get_version
        run: |
          # The same rule as BUILD_COMMIT_HASH in python-main.yml: a v* tag has the release version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=$(cd bindings/python && python -c "import find_version as v; print(v.get_package_version())")
          else
            VERSION=$(cd bindings/python && python -c "import find_version as v; print(v.get_package_dev_version('$GITHUB_SHA'))")
          fi
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch action and get run ID
        uses: codex-/return-dispatch@v4.0.1
        id: return_dispatch
        with:
          token: ${{ secrets.BOM_GITHUB_TOKEN }}
          ref: "main"
          repo: "luxonis-bom"
          owner: "luxonis"
          workflow: "dispatch_main.yml"
          workflow_inputs: '{"depthai": "${{ github.ref_name }}", "depthai_version_dependencies": "${{ steps.get_version.outputs.version }}", "depthai_nodes": "latest", "luxonis_os": "latest", "test_experiments": "true" }'

      - name: Wait for the dispatched workflow to complete
        id: get_runner
        env:
          RUN_ID: ${{ steps.return_dispatch.outputs.run_id }}
          TOKEN: ${{ secrets.BOM_GITHUB_TOKEN }}
        run: |
            OWNER="luxonis"
            REPO="luxonis-bom"

            echo "STARTING TO WAIT FOR RUN https://github.com/$OWNER/$REPO/actions/runs/$RUN_ID"

            STATUS=$(curl -s --header "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID" | jq -r .status)

            while [ "$STATUS" != "completed" ]; do
              echo "Waiting for the workflow run to complete..."
              sleep 60
              STATUS=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID" | jq -r .status)
              echo "Current status $STATUS"
            done
            CONCLUSION=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID" | jq -r .conclusion)

            echo "Run $RUN_ID is completed. Conclusion is $CONCLUSION"

            # Set outputs for the job using GITHUB_OUTPUT file
            echo "runner_conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
            if [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "skipped" ]; then
                echo "Failed job"
                exit 1
            fi
