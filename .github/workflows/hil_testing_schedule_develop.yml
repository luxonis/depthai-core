name: DepthAI Core HIL Testing Develop Schedule

# Scheduled workflows run only from the default branch (main), so changes here take effect on main.
on:
  schedule:
    - cron: '0 20 * * *' # Every day at 20:00 Ljubljana time
      timezone: 'Europe/Ljubljana'
    - cron: '0 3 * * 6' # Saturdays at 03:00 UTC
    - cron: '0 3 * * 0' # Sundays at 03:00 UTC

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger develop HIL testing
        if: github.event.schedule == '0 3 * * 6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hil_testing_weekly.yml --repo "$GITHUB_REPOSITORY" --ref develop

      - name: Trigger weekly Python wheels and stability
        if: github.event.schedule == '0 3 * * 0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly_stability.yml --repo "$GITHUB_REPOSITORY" --ref develop

      - name: Trigger nightly develop build and HIL testing
        # contains(): the docs do not say if github.event.schedule also holds the timezone.
        if: contains(github.event.schedule, '0 20 * * *')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes to develop do not start a build, so build the newest develop commit here. Skip a build that
          # passed for the commit or still runs; a failed or cancelled build runs again.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
          runs() { gh run list --repo "$GITHUB_REPOSITORY" --workflow "$1" --branch develop --commit "$sha" --json databaseId,event,status,conclusion --jq "$2"; }
          for workflow in main.workflow.yml containers.yml; do
            if [[ $(runs "$workflow" 'any(.[]; .event != "pull_request" and (.status != "completed" or .conclusion == "success"))') == true ]]; then
              echo "$workflow passed or runs for develop commit $sha; skipping"
            else
              echo "Triggering $workflow for develop commit $sha"
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref develop
            fi
          done

          # The wheels of a commit can be uploaded only once (upload-ak.sh: twine upload without --skip-existing).
          # Look for a passed upload job in the nightly runs and in python-main.yml runs (manual runs, and push
          # runs from before develop was built nightly). The BOM tests run each night: with the new wheels, or with
          # the uploaded wheels when develop did not change.
          uploaded=false
          for workflow in hil_testing_nightly.yml python-main.yml; do
            for id in $(runs "$workflow" '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --paginate \
                   --jq '.jobs[] | select((.name | endswith("upload-wheels-to-ak")) and .conclusion == "success") | .id' | grep -q .; then
                uploaded=true
              fi
            done
          done
          if [[ "$uploaded" == true ]]; then
            echo "The wheels of develop commit $sha are uploaded; running the HIL tests and the BOM tests with them"
            gh workflow run hil_testing_nightly.yml --repo "$GITHUB_REPOSITORY" --ref develop -f bom=true
          elif [[ $(runs python-main.yml 'any(.[]; .event != "pull_request" and .status != "completed")') == true ]]; then
            # A second build would fail at the upload. That run does not start the BOM tests (it is not a push).
            echo "A python-main.yml run still builds the wheels of develop commit $sha; running the HIL tests only (no wheels for the BOM tests yet)"
            gh workflow run hil_testing_nightly.yml --repo "$GITHUB_REPOSITORY" --ref develop
          else
            echo "Building the wheels of develop commit $sha, then the HIL tests and, when all wheels are uploaded, the BOM tests"
            gh workflow run hil_testing_nightly.yml --repo "$GITHUB_REPOSITORY" --ref develop -f build_and_bom=true
          fi

      - name: Notify Slack
        if: github.event.schedule == '0 3 * * 6'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BOT_CHANNEL_ID: ${{ secrets.SLACK_BOT_CHANNEL_ID_TEST }}
          SCHEDULER_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="*Scheduled DepthAI Core HIL tests triggered*
          Branch: develop
          Workflow: DepthAI Core HIL Testing
          Scheduler Run: $SCHEDULER_RUN_URL"

          jq -n --arg user_id "$SLACK_BOT_CHANNEL_ID" --arg message "$MESSAGE" \
            '{"channel": $user_id, "text": $message}' > payload.json

          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json" \
            --data @payload.json
