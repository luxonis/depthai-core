<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .title { font-weight: bold; font-size: 14px; }
    .note { fill: #555; font-size: 12px; }
    .ray { stroke: #d9534f; stroke-width: 1.5; }
    .surface { fill: none; stroke: #1f6feb; stroke-width: 2.5; }
    .cam { fill: #222; }
    .ground { fill: #e6f0ff; stroke: #1f6feb; stroke-width: 2; }
  </style>

  <!-- Panel 1: Equirectangular (sphere) -->
  <g transform="translate(20,20)">
    <text x="110" y="14" text-anchor="middle" class="title">Equirectangular</text>
    <text x="110" y="30" text-anchor="middle" class="note">inputs warped onto a sphere</text>
    <circle cx="110" cy="140" r="80" class="surface"/>
    <ellipse cx="110" cy="140" rx="80" ry="22" fill="none" stroke="#1f6feb" stroke-width="1" stroke-dasharray="4 3"/>
    <g class="ray">
      <line x1="110" y1="140" x2="179" y2="100"/>
      <line x1="110" y1="140" x2="150" y2="69"/>
      <line x1="110" y1="140" x2="41" y2="100"/>
      <line x1="110" y1="140" x2="70" y2="69"/>
      <line x1="110" y1="140" x2="110" y2="220"/>
    </g>
    <circle cx="110" cy="140" r="5" class="cam"/>
    <text x="110" y="250" text-anchor="middle" class="note">fx = fy = sphere radius in px</text>
    <text x="110" y="266" text-anchor="middle" class="note">full 360 x 180 degrees</text>
    <text x="110" y="282" text-anchor="middle" class="note">straight lines bend near the poles</text>
  </g>

  <!-- Panel 2: Cylindrical (cylinder) -->
  <g transform="translate(280,20)">
    <text x="110" y="14" text-anchor="middle" class="title">Cylindrical</text>
    <text x="110" y="30" text-anchor="middle" class="note">inputs warped onto a cylinder</text>
    <path d="M30,80 a80,22 0 1,1 160,0 a80,22 0 1,1 -160,0" class="surface"/>
    <line x1="30" y1="80" x2="30" y2="200" class="surface"/>
    <line x1="190" y1="80" x2="190" y2="200" class="surface"/>
    <path d="M30,200 a80,22 0 0,0 160,0" class="surface"/>
    <path d="M30,200 a80,22 0 0,1 160,0" fill="none" stroke="#1f6feb" stroke-width="1" stroke-dasharray="4 3"/>
    <g class="ray">
      <line x1="110" y1="140" x2="190" y2="120"/>
      <line x1="110" y1="140" x2="190" y2="165"/>
      <line x1="110" y1="140" x2="30" y2="120"/>
      <line x1="110" y1="140" x2="30" y2="165"/>
    </g>
    <circle cx="110" cy="140" r="5" class="cam"/>
    <text x="110" y="250" text-anchor="middle" class="note">fx = fy = cylinder radius in px</text>
    <text x="110" y="266" text-anchor="middle" class="note">360 degrees around one axis</text>
    <text x="110" y="282" text-anchor="middle" class="note">vertical lines stay straight</text>
  </g>

  <!-- Panel 3: Perspective (plane) -->
  <g transform="translate(540,20)">
    <text x="110" y="14" text-anchor="middle" class="title">Perspective</text>
    <text x="110" y="30" text-anchor="middle" class="note">inputs warped onto a pinhole plane</text>
    <line x1="30" y1="70" x2="190" y2="70" class="surface"/>
    <g class="ray">
      <line x1="110" y1="190" x2="40" y2="70"/>
      <line x1="110" y1="190" x2="75" y2="70"/>
      <line x1="110" y1="190" x2="110" y2="70"/>
      <line x1="110" y1="190" x2="145" y2="70"/>
      <line x1="110" y1="190" x2="180" y2="70"/>
    </g>
    <circle cx="110" cy="190" r="5" class="cam"/>
    <text x="110" y="250" text-anchor="middle" class="note">fx, fy, cx, cy of a pinhole camera</text>
    <text x="110" y="266" text-anchor="middle" class="note">straight lines stay straight</text>
    <text x="110" y="282" text-anchor="middle" class="note">field of view below 180 degrees</text>
  </g>

  <!-- Panel 4: Planar projection (bird's-eye view) -->
  <g transform="translate(800,20)">
    <text x="110" y="14" text-anchor="middle" class="title">Planar projection</text>
    <text x="110" y="30" text-anchor="middle" class="note">inputs projected onto a plane in the scene</text>
    <polygon points="20,200 200,200 170,150 50,150" class="ground"/>
    <text x="110" y="185" text-anchor="middle" class="note">ground plane</text>
    <!-- two real cameras looking down at the plane -->
    <g class="ray">
      <line x1="40" y1="100" x2="60" y2="152"/>
      <line x1="40" y1="100" x2="110" y2="152"/>
      <line x1="180" y1="100" x2="110" y2="152"/>
      <line x1="180" y1="100" x2="160" y2="152"/>
    </g>
    <circle cx="40" cy="100" r="5" class="cam"/>
    <circle cx="180" cy="100" r="5" class="cam"/>
    <!-- virtual camera above, looking straight down -->
    <g stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
      <line x1="110" y1="60" x2="55" y2="152"/>
      <line x1="110" y1="60" x2="165" y2="152"/>
    </g>
    <rect x="103" y="53" width="14" height="14" fill="#1f6feb"/>
    <text x="110" y="48" text-anchor="middle" class="note">virtual camera (setView)</text>
    <text x="110" y="250" text-anchor="middle" class="note">output: Perspective image of the plane</text>
    <text x="110" y="266" text-anchor="middle" class="note">cameras need not overlap</text>
    <text x="110" y="282" text-anchor="middle" class="note">inputs may stay distorted</text>
  </g>
</svg>
